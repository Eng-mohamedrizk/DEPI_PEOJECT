<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GradUp — مشروع تخرجك، شركتك الناشئة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --teal-900:#0A3F44; --teal-700:#0F5C63; --teal-500:#157A83;
  --teal-100:#EAF3F4; --teal-050:#F4F9FA;
  --amber-500:#F2A93B; --amber-100:#FDF3E1; --amber-700:#B8791F;
  --ink-900:#1B1F23; --ink-600:#5B6770; --ink-400:#8A949C;
  --line-300:#D5DCE0; --line-200:#E6EBEE;
  --surface:#FFFFFF; --canvas:#F6F3EC;
  --ok:#15803D; --warn:#C2410C; --bad:#B91C1C; --violet:#6D28D9;
  --shadow-xs:0 1px 2px rgba(27,31,35,.06);
  --shadow-sm:0 2px 6px rgba(27,31,35,.07);
  --shadow-md:0 8px 20px rgba(27,31,35,.08);
  --shadow-lg:0 18px 40px rgba(27,31,35,.14);
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px; --r-pill:999px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --font:"Cairo","Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--canvas); color:var(--ink-900);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--teal-700);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{
  outline:none;
  box-shadow:0 0 0 3px var(--teal-100),0 0 0 5px var(--teal-700);
  border-radius:8px;
}
[hidden]{display:none !important}

/* ============ LAYOUT ============ */
.app{min-height:100vh;display:flex;flex-direction:column}

/* Top bar */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;background:rgba(255,255,255,.85);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid transparent;transition:border-color .2s var(--ease);
}
.topbar.scrolled{border-bottom-color:var(--line-200)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--teal-700)}
.brand-mark{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,var(--teal-700),var(--teal-500));
  display:grid;place-items:center;color:#fff;font-weight:700;
}
.spacer{flex:1}
.icon-btn{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  color:var(--ink-600);position:relative;transition:background .15s var(--ease),color .15s var(--ease);
}
.icon-btn:hover{background:var(--teal-100);color:var(--teal-700)}
.icon-btn .dot{
  position:absolute;top:8px;inset-inline-end:8px;min-width:18px;height:18px;padding:0 4px;
  background:var(--amber-500);color:#1B1F23;font-size:11px;font-weight:700;
  border-radius:999px;display:grid;place-items:center;border:2px solid #fff;
}
.lang{
  display:flex;background:var(--teal-100);border-radius:var(--r-pill);padding:3px;
}
.lang button{
  padding:6px 12px;border-radius:var(--r-pill);font-size:13px;font-weight:600;
  color:var(--teal-700);transition:background .15s var(--ease),color .15s var(--ease);
}
.lang button.active{background:var(--teal-700);color:#fff}

/* Sidebar + main */
.shell{flex:1;display:grid;grid-template-columns:1fr;max-width:1440px;width:100%;margin:0 auto;padding:0 20px 40px;gap:24px}
@media(min-width:1024px){.shell{grid-template-columns:240px 1fr}}
.sidebar{display:none}
@media(min-width:1024px){
  .sidebar{display:flex;flex-direction:column;gap:4px;position:sticky;top:88px;align-self:start}
  .sidebar a{
    display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
    color:var(--ink-600);font-weight:600;text-decoration:none;position:relative;
    transition:background .15s var(--ease),color .15s var(--ease);
  }
  .sidebar a:hover{background:var(--teal-050);color:var(--teal-700);text-decoration:none}
  .sidebar a.active{background:var(--teal-100);color:var(--teal-700)}
  .sidebar a.active::before{
    content:"";position:absolute;inset-inline-start:-8px;top:10px;bottom:10px;
    width:3px;border-radius:3px;background:var(--teal-700);
  }
}
main{min-width:0;display:flex;flex-direction:column;gap:24px}

/* ============ COMPONENTS ============ */
.card{
  background:var(--surface);border:1px solid var(--line-200);border-radius:var(--r-lg);
  padding:20px;box-shadow:var(--shadow-xs);
}
.card.amber{background:var(--amber-100);border-color:#F2DFB4}
.card.tint{background:var(--teal-050);border-color:var(--teal-100)}
.card h3{font-size:18px;font-weight:700;margin-bottom:8px}
.card p{color:var(--ink-600);font-size:14px}
.card .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;
  transition:transform .15s var(--ease),box-shadow .2s var(--ease),background .15s var(--ease);
  white-space:nowrap;
}
.btn-primary{background:var(--teal-700);color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:var(--teal-500);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-primary:active{transform:translateY(0)}
.btn-secondary{background:#fff;color:var(--teal-700);border:1.5px solid var(--line-300)}
.btn-secondary:hover{border-color:var(--teal-700);background:var(--teal-050)}
.btn-ghost{background:transparent;color:var(--teal-700)}
.btn-ghost:hover{background:var(--teal-100)}
.btn-danger{background:var(--bad);color:#fff}
.btn-danger:hover{background:#9c1717}
.btn-accent{background:var(--amber-500);color:#1B1F23}
.btn-accent:hover{background:#e29b2c}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none !important}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.block{width:100%}

.badge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-size:12px;font-weight:700;line-height:1.6;
}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
.badge.draft{background:#EEF1F3;color:var(--ink-600)}
.badge.submitted{background:var(--teal-100);color:var(--teal-700)}
.badge.review{background:var(--amber-100);color:var(--amber-700)}
.badge.changes{background:#FEE6D6;color:var(--warn)}
.badge.approved{background:#DCFCE7;color:var(--ok)}
.badge.mentoring{background:var(--teal-100);color:var(--teal-700)}
.badge.published{background:#DCFCE7;color:var(--ok)}
.badge.funded{background:#EDE9FE;color:var(--violet)}
.badge.rejected{background:#FEE2E2;color:var(--bad)}
.badge.pending{background:var(--amber-100);color:var(--amber-700)}
.badge.accepted{background:#DCFCE7;color:var(--ok)}
.badge.declined{background:#FEE2E2;color:var(--bad)}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:14px;font-weight:600;color:var(--ink-900)}
.field .hint{font-size:12px;color:var(--ink-600)}
.field input,.field select,.field textarea{
  min-height:44px;padding:10px 14px;border:1.5px solid var(--line-300);
  border-radius:12px;background:#fff;transition:border-color .15s var(--ease),box-shadow .15s var(--ease);
}
.field textarea{min-height:100px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--teal-700);box-shadow:0 0 0 3px var(--teal-100);
}
.field.error input,.field.error select,.field.error textarea{border-color:var(--bad)}
.field .err{font-size:12px;color:var(--bad);display:flex;gap:6px;align-items:center}
.field .ok{font-size:12px;color:var(--ok)}

/* Stepper */
.stepper{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line-200);
  border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-xs);overflow-x:auto}
.step{flex:1;min-width:120px;display:flex;flex-direction:column;gap:8px;position:relative}
.step .bar{height:6px;border-radius:999px;background:var(--line-200);overflow:hidden}
.step .bar>span{display:block;height:100%;width:0;background:var(--teal-700);transition:width .5s var(--ease)}
.step.done .bar>span{width:100%}
.step.current .bar>span{width:100%;background:var(--amber-500)}
.step .label{font-size:13px;font-weight:600;color:var(--ink-600);display:flex;align-items:center;gap:6px}
.step.done .label{color:var(--teal-700)}
.step.current .label{color:var(--amber-700)}
.step .num{
  display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;
  background:var(--line-200);font-size:11px;color:var(--ink-600);font-weight:700;
}
.step.done .num{background:var(--teal-700);color:#fff}
.step.current .num{background:var(--amber-500);color:#1B1F23;animation:pulse 1.6s var(--ease) infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,169,59,.55)}50%{box-shadow:0 0 0 8px rgba(242,169,59,0)}}

/* Timeline */
.timeline{display:flex;flex-direction:column;gap:2px;position:relative;padding-inline-start:28px}
.timeline::before{content:"";position:absolute;inset-inline-start:9px;top:8px;bottom:8px;width:2px;background:var(--line-200)}
.tl-item{position:relative;padding:10px 0}
.tl-item::before{
  content:"";position:absolute;inset-inline-start:-28px;top:16px;width:20px;height:20px;
  border-radius:50%;background:var(--teal-700);border:3px solid #fff;box-shadow:0 0 0 1px var(--line-200);
}
.tl-item.pending::before{background:var(--line-300)}
.tl-item h4{font-size:15px;font-weight:700;margin-bottom:2px}
.tl-item p{font-size:13px;color:var(--ink-600)}

/* Project cards grid */
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:720px){.grid.cols-2{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid.cols-3{grid-template-columns:repeat(3,1fr)}}
.project-card{
  display:flex;flex-direction:column;gap:12px;text-align:start;
  background:#fff;border:1px solid var(--line-200);border-radius:var(--r-lg);
  padding:18px;box-shadow:var(--shadow-xs);transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease);
}
.project-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--teal-100)}
.project-card h4{font-size:17px;font-weight:700}
.project-card .meta{font-size:13px;color:var(--ink-600);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  background:var(--teal-100);color:var(--teal-700);font-size:12px;font-weight:600;
}

/* File list */
.file{
  display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line-200);
  border-radius:12px;margin-bottom:8px;background:#fff;
}
.file .fico{width:36px;height:36px;border-radius:10px;background:var(--teal-100);display:grid;place-items:center;color:var(--teal-700);font-weight:700;font-size:12px}
.file .fname{font-weight:600;font-size:14px}
.file .fsize{font-size:12px;color:var(--ink-600)}
.file select{border:1px solid var(--line-300);border-radius:8px;padding:6px 8px;font-size:12px}

.dropzone{
  border:2px dashed var(--line-300);border-radius:var(--r-lg);padding:32px 20px;
  text-align:center;background:var(--teal-050);transition:border-color .2s var(--ease),background .2s var(--ease),transform .2s var(--ease);
  cursor:pointer;
}
.dropzone.dragover{border-color:var(--teal-700);background:var(--teal-100);transform:scale(1.01)}
.dropzone p{color:var(--ink-600);font-size:14px;margin-top:8px}

/* Chat */
.chat{display:flex;flex-direction:column;gap:12px;max-height:360px;overflow-y:auto;padding:8px}
.bubble{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;box-shadow:var(--shadow-xs)}
.bubble.them{background:#fff;border:1px solid var(--line-200);align-self:flex-start;border-start-start-radius:4px}
.bubble.me{background:var(--teal-700);color:#fff;align-self:flex-end;border-start-end-radius:4px}
.bubble .time{display:block;font-size:11px;opacity:.7;margin-top:4px}
.chat-input{display:flex;gap:8px;margin-top:12px}
.chat-input input{flex:1;min-height:44px;padding:10px 14px;border:1.5px solid var(--line-300);border-radius:12px}
.chat-input input:focus{outline:none;border-color:var(--teal-700);box-shadow:0 0 0 3px var(--teal-100)}

/* Modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(27,31,35,.45);backdrop-filter:blur(4px);
  display:grid;place-items:center;z-index:100;padding:20px;
  animation:fadeIn .2s var(--ease);
}
.modal{
  background:#fff;border-radius:var(--r-lg);padding:24px;max-width:480px;width:100%;
  box-shadow:var(--shadow-lg);animation:pop .25s var(--ease-spring);
}
.modal h3{font-size:20px;font-weight:700;margin-bottom:8px}
.modal p{color:var(--ink-600);margin-bottom:20px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}

/* Toast */
.toasts{position:fixed;bottom:20px;inset-inline-start:20px;display:flex;flex-direction:column;gap:10px;z-index:200;max-width:360px}
.toast{
  background:#fff;border:1px solid var(--line-200);border-radius:12px;padding:12px 16px;
  box-shadow:var(--shadow-md);display:flex;gap:10px;align-items:center;font-size:14px;
  animation:slideIn .25s var(--ease-spring);
}
.toast .ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;flex-shrink:0}
.toast.success .ico{background:var(--ok)}
.toast.error .ico{background:var(--bad)}
.toast.info .ico{background:var(--teal-700)}
.toast.warn .ico{background:var(--amber-500);color:#1B1F23}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Notifications drawer */
.drawer{
  position:fixed;top:0;inset-inline-start:0;height:100vh;width:min(400px,90vw);
  background:#fff;z-index:100;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;animation:drawerIn .25s var(--ease);
}
@keyframes drawerIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line-200)}
.drawer .list{flex:1;overflow-y:auto;padding:8px}
.notif{display:flex;gap:12px;padding:12px;border-radius:12px}
.notif:hover{background:var(--teal-050)}
.notif .dot{width:8px;height:8px;border-radius:50%;background:var(--amber-500);margin-top:6px;flex-shrink:0}
.notif.unread{background:var(--teal-050)}
.notif .title{font-weight:600;font-size:14px}
.notif .sub{font-size:12px;color:var(--ink-600)}

/* Empty state */
.empty{text-align:center;padding:48px 20px;color:var(--ink-600)}
.empty svg{margin-bottom:16px}
.empty h3{color:var(--ink-900);margin-bottom:6px}

/* Hero */
.hero{
  display:grid;gap:24px;align-items:center;
  background:
    radial-gradient(60% 60% at 30% 10%,var(--teal-100),transparent 70%),
    radial-gradient(50% 50% at 90% 90%,var(--amber-100),transparent 70%),
    var(--surface);
  border:1px solid var(--line-200);border-radius:var(--r-xl);padding:32px 24px;
  box-shadow:var(--shadow-sm);
}
@media(min-width:900px){.hero{grid-template-columns:1.15fr .85fr;padding:48px}}
.hero h1{font-size:clamp(28px,4.4vw,44px);line-height:1.25;font-weight:700;margin-bottom:16px}
.hero h1 em{font-style:normal;color:var(--teal-700);position:relative}
.hero h1 em::after{content:"";position:absolute;inset-inline:0;bottom:2px;height:8px;background:rgba(242,169,59,.35);border-radius:4px;z-index:-1}
.hero p{color:var(--ink-600);font-size:17px;margin-bottom:24px;max-width:52ch}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap}
.hero-art{display:grid;place-items:center}

/* Steps / sections */
.section-title{font-size:22px;font-weight:700;margin:8px 0}
.section-sub{color:var(--ink-600);margin-bottom:16px}

.steps{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:720px){.steps{grid-template-columns:repeat(3,1fr)}}
.step-card{
  background:#fff;border:1px solid var(--line-200);border-radius:var(--r-lg);padding:20px;
  box-shadow:var(--shadow-xs);transition:transform .2s var(--ease),box-shadow .2s var(--ease);
}
.step-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.step-card .n{
  width:36px;height:36px;border-radius:12px;background:var(--teal-100);color:var(--teal-700);
  display:grid;place-items:center;font-weight:700;margin-bottom:12px;
}
.step-card h4{font-size:17px;font-weight:700;margin-bottom:6px}
.step-card p{font-size:14px;color:var(--ink-600)}

.sectors{display:flex;gap:8px;flex-wrap:wrap}
.sector{
  padding:8px 14px;border-radius:999px;border:1.5px solid var(--line-300);
  background:#fff;font-size:14px;font-weight:600;color:var(--ink-600);
  transition:all .15s var(--ease);
}
.sector:hover{border-color:var(--teal-700);color:var(--teal-700)}
.sector.active{background:var(--teal-700);color:#fff;border-color:var(--teal-700)}

.investor-band{
  background:linear-gradient(135deg,var(--teal-900),var(--teal-700));
  color:#fff;border-radius:var(--r-xl);padding:32px 24px;
  display:grid;gap:16px;align-items:center;
}
@media(min-width:720px){.investor-band{grid-template-columns:1fr auto;padding:40px}}
.investor-band h2{font-size:24px;font-weight:700;margin-bottom:6px}
.investor-band p{opacity:.85;font-size:15px}
.investor-band .btn-accent{min-height:48px;padding:0 22px;font-weight:700}

footer.site{
  margin-top:32px;padding:32px 20px 20px;border-top:1px solid var(--line-200);
  background:var(--surface);color:var(--ink-600);font-size:14px;
}
footer.site .cols{display:grid;gap:24px;grid-template-columns:1fr;max-width:1440px;margin:0 auto 24px}
@media(min-width:720px){footer.site .cols{grid-template-columns:repeat(4,1fr)}}
footer.site h5{color:var(--ink-900);font-size:14px;font-weight:700;margin-bottom:10px}
footer.site a{display:block;color:var(--ink-600);padding:4px 0}
footer.site .bottom{max-width:1440px;margin:0 auto;padding-top:20px;border-top:1px solid var(--line-200);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}

/* Skeletons */
.skel{background:linear-gradient(90deg,#EEF1F3 0%,#F7F9FA 40%,#EEF1F3 80%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:8px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.skel-card{height:140px}
.skel-line{height:12px;margin:8px 0}

/* Autosave */
.autosave{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-600)}
.autosave .pulse{width:8px;height:8px;border-radius:50%;background:var(--amber-500);animation:pulse 1.2s infinite}
.autosave.saved .pulse{background:var(--ok);animation:none}

/* Tabs */
.tabs{display:flex;gap:4px;padding:4px;background:var(--teal-050);border-radius:12px;width:fit-content;flex-wrap:wrap}
.tabs button{padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-600);transition:background .15s var(--ease),color .15s var(--ease)}
.tabs button.active{background:#fff;color:var(--teal-700);box-shadow:var(--shadow-xs)}

/* NDA lock */
.locked{
  position:relative;border:1px solid var(--line-200);border-radius:var(--r-lg);overflow:hidden;
  background:linear-gradient(180deg,#fff,#FAFCFC);padding:24px;text-align:center;
}
.locked .blur{filter:blur(6px);user-select:none;opacity:.5}
.locked .overlay{
  position:absolute;inset:0;display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.92));
  padding:24px;text-align:center;
}

};

function go(route, params={}){
  S.route = route;
  S.params = params;
  save();
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function setRole(role){
  S.role = role;
  save();
  go(role === "student" ? "dashboard" : role === "mentor" ? "mentor" : role === "reviewer" ? "review" : role === "investor" ? "pitch" : "admin");
}

/* ---------- Render ---------- */
function render(){
  // Topbar state
  const authed = S.route !== "home" && S.route !== "register" && S.route !== "login";
  document.getElementById("bellBtn").hidden = !authed;
  document.getElementById("userBtn").hidden = !authed;
  document.getElementById("menuBtn").hidden = true; // simplified
  document.getElementById("bellCount").textContent = S.notifications.filter(n=>n.unread).length;
  document.getElementById("bellCount").hidden = !S.notifications.some(n=>n.unread);
  document.getElementById("footer").hidden = S.route !== "home";

  // Sidebar
  renderSidebar(authed);

  // Main
  const fn = ROUTES[S.route] || renderHome;
  document.getElementById("main").innerHTML = fn();
  attachHandlers();
}

function renderSidebar(authed){
  const el = document.getElementById("sidebar");
  if (!authed){ el.innerHTML = ""; return; }
  const items = sidebarForRole(S.role);
  el.innerHTML = items.map(i => `
    <a href="#" data-route="${i.route}" class="${S.route===i.route?'active':''}">
      <span aria-hidden="true">${i.icon}</span><span>${t(i.label)}</span>
    </a>
  `).join("") + `
    <a href="#" data-route="__reset" style="margin-top:auto;color:var(--bad)">
      <span aria-hidden="true">↻</span><span>${t("resetDemo")}</span>
    </a>
  `;
  el.querySelectorAll("a").forEach(a => {
    a.addEventListener("click", (e)=>{
      e.preventDefault();
      const r = a.dataset.route;
      if (r === "__reset"){ resetDemo(); return; }
      go(r);
    });
  });
}

function sidebarForRole(role){
  if (role === "student") return [
    {route:"dashboard", label:"dashboard", icon:"🏠"},
    {route:"upload", label:"project", icon:"📦"},
    {route:"mentor", label:"messages", icon:"💬"},
    {route:"canvas", label:"canvas", icon:"🧩"},
    {route:"meetings", label:"meetings", icon:"📅"},
    {route:"project", label:"documents", icon:"📄"}
  ];
  if (role === "mentor") return [
    {route:"mentor", label:"dashboard", icon:"🏠"},
    {route:"meetings", label:"meetings", icon:"📅"}
  ];
  if (role === "reviewer") return [
    {route:"review", label:"review", icon:"🔎"}
  ];
  if (role === "investor") return [
    {route:"pitch", label:"pitchBoard", icon:"🚀"},
    {route:"meetings", label:"meetings", icon:"📅"}
  ];
  return [
    {route:"admin", label:"admin", icon:"⚙️"}
  ];
}

function statusToStage(status){
  if (["draft","submitted"].includes(status)) return "upload";
  if (["review","changes","rejected"].includes(status)) return "screening";
  if (["approved","mentoring"].includes(status)) return "mentoring";
  return "pitch";
}

function nextStepFor(status){
  switch(status){
    case "draft":    return {title:"nextComplete", cta:"upload", ctaLabel:"project"};
    case "submitted":return {title:"nextWait", cta:null};
    case "review":   return {title:"nextWait", cta:null};
    case "changes":  return {title:"nextAddDoc", cta:"upload", ctaLabel:"addDoc"};
    case "approved": return {title:"nextMentor", cta:"mentor", ctaLabel:"openChat"};
    case "mentoring":return {title:"nextPublish", cta:"project", ctaLabel:"publish"};
    case "published":return {title:"nextShare", cta:"pitch", ctaLabel:"pitchBoard"};
    default: return {title:"nextWait", cta:null};
  }
}

function stepperHTML(currentIdx){
  return `
    <div class="stepper" role="list" aria-label="${t("stageCurrent")}">
      ${STAGES.map((s,i)=>`
        <div class="step ${i<currentIdx?'done':''} ${i===currentIdx?'current':''}" role="listitem">
          <div class="bar"><span></span></div>
          <div class="label"><span class="num">${i+1}</span>${t(s)}</div>
        </div>
      `).join("")}
    </div>`;
}

function timelineHTML(status){
  const order = ["submitted","review","mentor","published"];
  const idx = {
    draft:-1, submitted:0, review:1, changes:1, rejected:1,
    approved:2, mentoring:2, published:3, funded:3
  }[status] ?? -1;
  const evts = [
    {k:"submittedEvt", d:LANG==="ar"?"12 مارس":"Mar 12"},
    {k:"reviewedEvt",  d:LANG==="ar"?"13 مارس":"Mar 13"},
    {k:"mentorEvt",    d:LANG==="ar"?"20 مارس":"Mar 20"},
    {k:"publishedEvt", d:LANG==="ar"?"2 أبريل":"Apr 2"}
  ];
  return `<div class="timeline">${evts.map((e,i)=>`
    <div class="tl-item ${i<=idx?'':'pending'}">
      <h4>${t(e.k)}</h4>
      <p>${i<=idx ? e.d : (LANG==="ar"?"بانتظار…":"Pending…")}</p>
    </div>`).join("")}</div>`;
}

          </div>`).join("")}
      </div>`;
  } else {
    const sector = (LANG==="ar"?SECTORS_AR:SECTORS_EN)[S.project.sector];
    const readyLabels = LANG==="ar" ? ["مبكر","نموذج أولي","جاهز للسوق","مكتمل"] : ["Early","Prototype","Market-ready","Complete"];
    body = `
      <div class="card tint">
        <h3>${S.project.title}</h3>

  return `

function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function toast(type, msg){
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  const ico = {success:"✓", error:"✕", info:"i", warn:"!"}[type] || "i";
  el.innerHTML = `<span class="ico">${ico}</span><span>${msg}</span>`;
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>{ el.style.opacity = "0"; el.style.transform = "translateY(8px)"; el.style.transition = "all .25s var(--ease)"; }, 3600);

}

/* ---------- Event delegation ---------- */
function attachHandlers(){
  // data-go
  document.querySelectorAll("[data-go]").forEach(el => {
    el.onclick = (e) => {
      e.preventDefault();
      const role = el.dataset.role;
      if (role) S.role = role;
      go(el.dataset.go, el.dataset.id ? {id: el.dataset.id} : {});
    };
  });
  // data-sector (home filters)
  document.querySelectorAll("[data-sector]").forEach(el => {
    el.onclick = () => {
      const i = +el.dataset.sector;
      S.filters.sector = S.filters.sector === i ? null : i;
      save(); render();
    };
  });
  // reset filters
  document.querySelectorAll("[data-reset-filters]").forEach(el => {
    el.onclick = () => { S.filters = {q:"", sector:null, ready:null}; save(); render(); };
  });
  // toast triggers
  document.querySelectorAll("[data-toast]").forEach(el => {
    el.onclick = () => toast(el.dataset.toast, el.dataset.toastMsg || "OK");
  });
  // dropzone
  const dz = document.getElementById("dropzone");
  if (dz){
    dz.onclick = () => document.getElementById("fileInput").click();
    dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("dragover"); };
    dz.ondragleave = () => dz.classList.remove("dragover");
    dz.ondrop = (e) => {
      e.preventDefault(); dz.classList.remove("dragover");
      addFiles(e.dataTransfer.files);
    };
    document.getElementById("fileInput").onchange = (e) => addFiles(e.target.files);
  }
  // chat scroll
  const chat = document.getElementById("chat");
  if (chat) chat.scrollTop = chat.scrollHeight;
}

function addFiles(files){
  [...files].forEach(f => {
    const ok = /\.(pdf|docx)$/i.test(f.name);
    if (!ok){ toast("error", LANG==="ar"?"نوع الملف غير مدعوم":"Unsupported file type"); return; }
    if (f.size > 25 * 1024 * 1024){ toast("error", LANG==="ar"?"الحجم الأقصى 25 ميجابايت":"Max size is 25 MB"); return; }
    S.project.docs.push({
      name: f.name,
      size: (f.size/1024/1024).toFixed(1) + " MB",
      vis: "private"
    });
  });
  save(); render();
}

/* ESC closes overlays */
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape"){ closeModal(); closeDrawer(); }
});

/* ---------- Init ---------- */
document.documentElement.lang = LANG;
document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("active", b.dataset.lang === LANG));

// If user is returning to an authed route but not registered, send them to dashboard anyway (demo).
render();
</script>
</body>
</html>
